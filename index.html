<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Weather App</title><script defer src=app.bundle.js></script><link href=app.css rel=stylesheet></head><body><main><h1>Weather Forecast</h1><form><label><input placeholder="Enter City Name" id=city name=city></label> <button type=submit id=submitBtn>Search</button></form><section class=weather-card><h2 class=location></h2><img src=# alt=icon class=icon><div class=temp></div><div class=condition-text></div><div class=more-info><div class=humidity><img src=# alt=humidity class="catImg humIMG"> <span class=category>Humidity</span> <span class="value hum"></span></div><div class=wind><img src=# alt=wind class="catImg windIMG"> <span class=category>Wind</span> <span class="value wnd"></span></div><div class=feels-like><img src=# alt=temp class="catImg feelsIMG"> <span class=category>Feels Like</span> <span class="value feels-temp"></span></div></div></section></main><div class=error-div></div></body></html>
